name: Deploy widget to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WIDGET_ENV: ${{ secrets.WIDGET_ENV || '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure WIDGET_ENV secret exists
        if: ${{ env.WIDGET_ENV == '' }}
        run: |
          echo "::error::Set the WIDGET_ENV secret with your .env contents" && exit 1

      - name: Write .env file
        if: ${{ env.WIDGET_ENV != '' }}
        run: printf '%s' "${WIDGET_ENV}" > .env
        shell: bash

      - name: Build TypeScript
        run: npm run build

      - name: Render static widget
        run: npm run render:dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
